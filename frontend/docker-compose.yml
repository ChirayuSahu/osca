services:
  osca-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osca-frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: rebuild
          path: package.json
