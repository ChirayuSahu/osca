services:
  redis:
    image: redis:7-alpine
    container_name: osca-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  osca-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osca-backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file:
      - .env
    develop:
      watch:
        - action: sync
          path: ./src
          target: /usr/src/app/src
        - action: rebuild
          path: package.json

volumes:
  redis_data:
