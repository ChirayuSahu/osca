services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osca-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    develop:
      watch:
        - action: sync
          path: ./src
          target: /usr/src/app/src
        - action: rebuild
          path: package.json
