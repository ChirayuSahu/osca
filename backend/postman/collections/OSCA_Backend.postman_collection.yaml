info:
  name: OSCA Backend API
  schema: https://schema.getpostman.com/json/collection/v2.1.0/collection.json
item:
  - name: Health Check
    request:
      method: GET
      header: []
      url:
        raw: "{{BASE_URL}}/api/v1/health"
        host:
          - "{{BASE_URL}}"
        path:
          - api
          - v1
          - health
    response: []
  - name: Auth
    item:
      - name: Redirect to GitHub
        request:
          method: GET
          header: []
          url:
            raw: "{{BASE_URL}}/api/v1/auth/github"
            host:
              - "{{BASE_URL}}"
            path:
              - api
              - v1
              - auth
              - github
        response: []
      - name: GitHub Callback (Exchange Code)
        request:
          method: GET
          header: []
          url:
            raw: "{{BASE_URL}}/api/v1/auth/github/callback?code=YOUR_OAUTH_CODE_HERE"
            host:
              - "{{BASE_URL}}"
            path:
              - api
              - v1
              - auth
              - github
              - callback
            query:
              - key: code
                value: YOUR_OAUTH_CODE_HERE
        response: []
  - name: Users
    item:
      - name: Get User by ID
        request:
          method: GET
          header: []
          url:
            raw: "{{BASE_URL}}/api/v1/users/USER_ID_HERE"
            host:
              - "{{BASE_URL}}"
            path:
              - api
              - v1
              - users
              - USER_ID_HERE
        response: []
      - name: Update User
        request:
          method: PUT
          header:
            - key: Content-Type
              value: application/json
              type: text
            - key: Authorization
              value: Bearer {{JWT_TOKEN}}
              type: text
          body:
            mode: raw
            raw: |
              {
                "name": "John Doe Updated",
                "skills": ["React", "TypeScript", "Node.js", "Prisma"]
              }
          url:
            raw: "{{BASE_URL}}/api/v1/users/USER_ID_HERE"
            host:
              - "{{BASE_URL}}"
            path:
              - api
              - v1
              - users
              - USER_ID_HERE
        response: []
  - name: Repositories
    item:
      - name: List User GitHub Repositories (Via Token)
        request:
          method: GET
          header:
            - key: Authorization
              value: Bearer {{JWT_TOKEN}}
              type: text
          url:
            raw: "{{BASE_URL}}/api/v1/repositories/github?page=1&limit=10"
            host:
              - "{{BASE_URL}}"
            path:
              - api
              - v1
              - repositories
              - github
            query:
              - key: page
                value: "1"
              - key: limit
                value: "10"
        response: []
      - name: Create/Upsert Repository
        request:
          method: POST
          header:
            - key: Content-Type
              value: application/json
              type: text
            - key: Authorization
              value: Bearer {{JWT_TOKEN}}
              type: text
          body:
            mode: raw
            raw: |
              {
                "fullName": "facebook/react"
              }
          url:
            raw: "{{BASE_URL}}/api/v1/repositories"
            host:
              - "{{BASE_URL}}"
            path:
              - api
              - v1
              - repositories
        response: []
      - name: List Repositories
        request:
          method: GET
          header:
            - key: Authorization
              value: Bearer {{JWT_TOKEN}}
              type: text
          url:
            raw: "{{BASE_URL}}/api/v1/repositories?page=1&limit=10"
            host:
              - "{{BASE_URL}}"
            path:
              - api
              - v1
              - repositories
            query:
              - key: page
                value: "1"
              - key: limit
                value: "10"
        response: []
      - name: Get Repository by ID
        request:
          method: GET
          header:
            - key: Authorization
              value: Bearer {{JWT_TOKEN}}
              type: text
          url:
            raw: "{{BASE_URL}}/api/v1/repositories/REPO_ID_HERE"
            host:
              - "{{BASE_URL}}"
            path:
              - api
              - v1
              - repositories
              - REPO_ID_HERE
        response: []
      - name: Delete Repository
        request:
          method: DELETE
          header:
            - key: Authorization
              value: Bearer {{JWT_TOKEN}}
              type: text
          url:
            raw: "{{BASE_URL}}/api/v1/repositories/REPO_ID_HERE"
            host:
              - "{{BASE_URL}}"
            path:
              - api
              - v1
              - repositories
              - REPO_ID_HERE
        response: []
  - name: Recommendations
    item:
      - name: Create/Upsert Recommendation
        request:
          method: POST
          header:
            - key: Content-Type
              value: application/json
              type: text
          body:
            mode: raw
            raw: |
              {
                "userId": "USER_ID_HERE",
                "repositoryId": "REPO_ID_HERE",
                "fitScore": 92.5,
                "explanation": "You have strong React and TypeScript experience and this repository actively requires React contributors.",
                "roadmap": [
                  "Read contributing guidelines",
                  "Setup project environment",
                  "Pick a good first issue"
                ]
              }
          url:
            raw: "{{BASE_URL}}/api/v1/recommendations"
            host:
              - "{{BASE_URL}}"
            path:
              - api
              - v1
              - recommendations
        response: []
      - name: List Recommendations
        request:
          method: GET
          header: []
          url:
            raw: "{{BASE_URL}}/api/v1/recommendations?userId=USER_ID_HERE&page=1&limit=10"
            host:
              - "{{BASE_URL}}"
            path:
              - api
              - v1
              - recommendations
            query:
              - key: userId
                value: USER_ID_HERE
              - key: page
                value: "1"
              - key: limit
                value: "10"
        response: []
      - name: Get Recommendation by ID
        request:
          method: GET
          header: []
          url:
            raw: "{{BASE_URL}}/api/v1/recommendations/REC_ID_HERE"
            host:
              - "{{BASE_URL}}"
            path:
              - api
              - v1
              - recommendations
              - REC_ID_HERE
        response: []
      - name: Update Recommendation Status
        request:
          method: PATCH
          header:
            - key: Content-Type
              value: application/json
              type: text
          body:
            mode: raw
            raw: |
              {
                "status": "ACCEPTED"
              }
          url:
            raw: "{{BASE_URL}}/api/v1/recommendations/REC_ID_HERE"
            host:
              - "{{BASE_URL}}"
            path:
              - api
              - v1
              - recommendations
              - REC_ID_HERE
        response: []
      - name: Delete Recommendation
        request:
          method: DELETE
          header: []
          url:
            raw: "{{BASE_URL}}/api/v1/recommendations/REC_ID_HERE"
            host:
              - "{{BASE_URL}}"
            path:
              - api
              - v1
              - recommendations
              - REC_ID_HERE
        response: []
  - name: Issues
    item:
      - name: List Issues
        request:
          method: GET
          header:
            - key: Authorization
              value: Bearer {{JWT_TOKEN}}
              type: text
          url:
            raw: "{{BASE_URL}}/api/v1/issues/facebook/react?page=1&limit=10"
            host: ["{{BASE_URL}}"]
            path: ["api", "v1", "issues", "facebook", "react"]
            query:
              - key: page
                value: "1"
              - key: limit
                value: "10"
      - name: Get Issue
        request:
          method: GET
          header:
            - key: Authorization
              value: Bearer {{JWT_TOKEN}}
              type: text
          url:
            raw: "{{BASE_URL}}/api/v1/issues/facebook/react/123"
            host: ["{{BASE_URL}}"]
            path: ["api", "v1", "issues", "facebook", "react", "123"]
      - name: List Issue Comments
        request:
          method: GET
          header:
            - key: Authorization
              value: Bearer {{JWT_TOKEN}}
              type: text
          url:
            raw: "{{BASE_URL}}/api/v1/issues/facebook/react/123/comments?page=1&limit=10"
            host: ["{{BASE_URL}}"]
            path: ["api", "v1", "issues", "facebook", "react", "123", "comments"]
            query:
              - key: page
                value: "1"
              - key: limit
                value: "10"
      - name: Create Issue
        request:
          method: POST
          header:
            - key: Content-Type
              value: application/json
              type: text
            - key: Authorization
              value: Bearer {{JWT_TOKEN}}
              type: text
          body:
            mode: raw
            raw: |
              {
                "title": "New Issue",
                "body": "Details"
              }
          url:
            raw: "{{BASE_URL}}/api/v1/issues/facebook/react"
            host: ["{{BASE_URL}}"]
            path: ["api", "v1", "issues", "facebook", "react"]
      - name: Create Issue Comment
        request:
          method: POST
          header:
            - key: Content-Type
              value: application/json
              type: text
            - key: Authorization
              value: Bearer {{JWT_TOKEN}}
              type: text
          body:
            mode: raw
            raw: |
              {
                "body": "New Comment"
              }
          url:
            raw: "{{BASE_URL}}/api/v1/issues/facebook/react/123/comments"
            host: ["{{BASE_URL}}"]
            path: ["api", "v1", "issues", "facebook", "react", "123", "comments"]
  - name: Jobs
    item:
      - name: List Jobs
        request:
          method: GET
          header:
            - key: Authorization
              value: Bearer {{JWT_TOKEN}}
              type: text
          url:
            raw: "{{BASE_URL}}/api/v1/jobs?page=1&limit=10"
            host: ["{{BASE_URL}}"]
            path: ["api", "v1", "jobs"]
            query:
              - key: page
                value: "1"
              - key: limit
                value: "10"
      - name: Sync Github Jobs
        request:
          method: POST
          header:
            - key: Authorization
              value: Bearer {{JWT_TOKEN}}
              type: text
          url:
            raw: "{{BASE_URL}}/api/v1/jobs/github/sync"
            host: ["{{BASE_URL}}"]
            path: ["api", "v1", "jobs", "github", "sync"]
  - name: Feed
    item:
      - name: Get Feed
        request:
          method: GET
          header:
            - key: Authorization
              value: Bearer {{JWT_TOKEN}}
              type: text
          url:
            raw: "{{BASE_URL}}/api/v1/feed?page=1&limit=10"
            host: ["{{BASE_URL}}"]
            path: ["api", "v1", "feed"]
            query:
              - key: page
                value: "1"
              - key: limit
                value: "10"
  - name: Interactions
    item:
      - name: Log Interaction
        request:
          method: POST
          header:
            - key: Content-Type
              value: application/json
              type: text
            - key: Authorization
              value: Bearer {{JWT_TOKEN}}
              type: text
          body:
            mode: raw
            raw: |
              {
                "repositoryId": "REPO_ID_HERE",
                "type": "REPOSITORY_VIEW"
              }
          url:
            raw: "{{BASE_URL}}/api/v1/interactions"
            host: ["{{BASE_URL}}"]
            path: ["api", "v1", "interactions"]
variable:
  - key: BASE_URL
    value: http://localhost:8000
    type: string
