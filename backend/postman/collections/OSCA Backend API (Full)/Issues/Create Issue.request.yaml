$kind: http-request
description: 'Opens an issue on GitHub as you. Needs the public_repo scope.'
url: '{{BASE_URL}}/api/v1/issues/{{owner}}/{{repo}}'
method: POST
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "title": "New Issue",
      "body": "Issue details"
    }
order: 4000
