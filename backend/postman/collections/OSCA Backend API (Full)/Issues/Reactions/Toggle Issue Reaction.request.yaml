$kind: http-request
description: 'Adds your reaction, or removes it if you already had it. Returns toggled: added | removed.'
url: '{{BASE_URL}}/api/v1/issues/{{owner}}/{{repo}}/{{issue_number}}/reactions'
method: POST
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "content": "+1"
    }
order: 2000
