$kind: http-request
description: 'Comments on an issue or PR as you. Needs the public_repo scope.'
url: '{{BASE_URL}}/api/v1/issues/{{owner}}/{{repo}}/{{issue_number}}/comments'
method: POST
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "body": "New comment"
    }
order: 5000
