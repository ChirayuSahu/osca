$kind: http-request
name: Create Issue Comment
url: "{{BASE_URL}}/api/v1/issues/{{owner}}/{{repo}}/{{issue_number}}/comments"
method: POST
headers:
  Authorization: Bearer {{JWT_TOKEN}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "body": "New comment"
    }
order: 5000
