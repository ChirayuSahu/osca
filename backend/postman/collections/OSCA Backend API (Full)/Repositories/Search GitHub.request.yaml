$kind: http-request
description: 'Searches all of GitHub, your own repositories first. Rate limited.'
url: '{{BASE_URL}}/api/v1/repositories/github/search?q=language:rust cli&page=1&limit=9&goodFirst=true'
method: GET
queryParams:
  - key: 'q'
    value: 'language:rust cli'
    description: 'GitHub search query'
  - key: 'page'
    value: '1'
    description: 'Page number'
  - key: 'limit'
    value: '9'
    description: 'Items per page (max 100)'
  - key: 'goodFirst'
    value: 'true'
    description: 'Only repos with good first issues'
order: 3600
