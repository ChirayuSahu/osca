$kind: http-request
description: 'Queues a repository-analysis job. Body takes url, fullName ("owner/repo") or owner + repo. POST /repositories is an alias. Rate limited.'
url: '{{BASE_URL}}/api/v1/repositories/analyze'
method: POST
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "url": "https://github.com/docker/cli"
    }
order: 2000
