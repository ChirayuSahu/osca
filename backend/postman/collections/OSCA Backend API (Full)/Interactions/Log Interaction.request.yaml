$kind: http-request
description: 'Records an interaction. action is one of REPOSITORY_VIEW, ISSUE_VIEW, REPOSITORY_LIKE, REPOSITORY_SAVE, ISSUE_COMMENT, CONTRIBUTION.'
url: '{{BASE_URL}}/api/v1/interactions'
method: POST
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "repositoryId": "{{repository_id}}",
      "action": "REPOSITORY_VIEW"
    }
order: 1000
