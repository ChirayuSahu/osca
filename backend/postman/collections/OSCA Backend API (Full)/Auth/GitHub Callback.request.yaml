$kind: http-request
description: 'GitHub redirects here after sign-in. Verifies state, then redirects to FRONTEND_URL/auth/callback?code=<one-time code>.'
url: '{{BASE_URL}}/api/v1/auth/github/callback?code=YOUR_OAUTH_CODE_HERE&state=STATE_FROM_COOKIE'
method: GET
queryParams:
  - key: 'code'
    value: 'YOUR_OAUTH_CODE_HERE'
    description: 'OAuth code from GitHub'
  - key: 'state'
    value: 'STATE_FROM_COOKIE'
    description: 'Must match the oauth_state cookie'
auth:
  type: noauth
order: 2000
