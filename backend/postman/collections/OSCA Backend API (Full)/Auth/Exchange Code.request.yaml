$kind: http-request
description: 'Trades the one-time code from the callback redirect (valid 60 s, single use) for a JWT and the user. Saves JWT_TOKEN.'
url: '{{BASE_URL}}/api/v1/auth/exchange'
method: POST
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "code": "ONE_TIME_CODE_FROM_REDIRECT"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      if (body?.data?.token) {
        pm.environment.set('JWT_TOKEN', body.data.token);
        if (body.data.user?.id) pm.collectionVariables.set('user_id', body.data.user.id);
      }
order: 2500
