$kind: http-request
description: 'Ranked recommendations. The order changes per visit unless seed is fixed. Each item has scoreInfo.reasons (why it was recommended); about one in seven slots is an exploration pick.'
url: '{{BASE_URL}}/api/v1/feed?page=1&limit=10'
method: GET
queryParams:
  - key: 'page'
    value: '1'
    description: 'Page number, starting at 1'
  - key: 'limit'
    value: '10'
    description: 'Items per page (max 100)'
  - key: 'language'
    value: 'TypeScript'
    description: 'Only repositories in this language'
    disabled: true
  - key: 'beginner'
    value: 'true'
    description: 'Only beginner-friendly repositories'
    disabled: true
  - key: 'seed'
    value: '42'
    description: 'Fix the visit seed to get a stable order'
    disabled: true
order: 1000
