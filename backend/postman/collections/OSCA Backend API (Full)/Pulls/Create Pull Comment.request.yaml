$kind: http-request
description: 'Comments on a pull request as you. Needs the public_repo scope.'
url: '{{BASE_URL}}/api/v1/pulls/{{owner}}/{{repo}}/{{pull_number}}/comments'
method: POST
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "body": "This is a comment on a pull request from the OSCA API"
    }
order: 4000
