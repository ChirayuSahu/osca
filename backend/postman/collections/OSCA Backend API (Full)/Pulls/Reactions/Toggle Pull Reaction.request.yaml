$kind: http-request
description: 'Adds or removes your reaction on a pull request.'
url: '{{BASE_URL}}/api/v1/pulls/{{owner}}/{{repo}}/{{pull_number}}/reactions'
method: POST
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "content": "+1"
    }
order: 2000
