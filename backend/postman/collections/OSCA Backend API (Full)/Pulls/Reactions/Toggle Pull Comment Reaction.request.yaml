$kind: http-request
description: 'Adds or removes your reaction on a review comment.'
url: '{{BASE_URL}}/api/v1/pulls/{{owner}}/{{repo}}/comments/{{comment_id}}/reactions'
method: POST
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "content": "+1"
    }
order: 4000
