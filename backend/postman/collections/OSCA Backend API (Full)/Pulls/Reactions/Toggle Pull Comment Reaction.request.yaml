$kind: http-request
name: Toggle Pull Comment Reaction
url: "{{BASE_URL}}/api/v1/pulls/{{owner}}/{{repo}}/comments/{{comment_id}}/reactions"
method: POST
headers:
  Authorization: Bearer {{JWT_TOKEN}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "content": "+1"
    }
order: 4000
