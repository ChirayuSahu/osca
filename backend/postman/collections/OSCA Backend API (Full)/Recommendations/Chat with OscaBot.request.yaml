$kind: http-request
description: 'Sends the conversation so far; returns markdown plus parsed recommendations. Not stored. Rate limited.'
url: '{{BASE_URL}}/api/v1/recommendations/chat'
method: POST
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "messages": [
        { "role": "user", "content": "Suggest beginner-friendly TypeScript projects" }
      ]
    }
order: 1000
