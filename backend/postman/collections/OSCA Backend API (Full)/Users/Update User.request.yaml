$kind: http-request
description: 'Update your own profile. Accepts name, avatarUrl and skills; email cannot be changed.'
url: '{{BASE_URL}}/api/v1/users/{{user_id}}'
method: PUT
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "name": "Updated Name",
      "skills": ["TypeScript", "React"]
    }
order: 2000
